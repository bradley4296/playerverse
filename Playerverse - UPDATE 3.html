        // --- Utility: Image Compression ---
        async function compressImage(base64Str, maxWidth = 900, maxHeight = 600, initialQuality = 0.7) {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = base64Str;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    if (width > height) {
                        if (width > maxWidth) {
                            height *= maxWidth / width;
                            width = maxWidth;
                        }
                    } else {
                        if (height > maxHeight) {
                            width *= maxHeight / height;
                            height = maxHeight;
                        }
                    }
                    canvas.width = width;
                    canvas.height = height;

                    let quality = initialQuality;
                    let result = "";
                    const targetLimit = 1000000; // Target string length ~1MB

                    const draw = (q, w, h) => {
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        return canvas.toDataURL('image/jpeg', q);
                    };

                    result = draw(quality, width, height);
                    
                    // Iteratively reduce quality then resolution to hit the target
                    while (result.length > targetLimit && quality > 0.1) {
                        quality -= 0.1;
                        result = draw(quality, width, height);
                    }
                    while (result.length > targetLimit && width > 200) {
                        width *= 0.8; height *= 0.8;
                        result = draw(quality, width, height);
                    }
                    resolve(result);
                };
            });
        }

        // --- Database & Sync Functions ---
        async function syncProfile() {
            if (!currentUser) return;
            const profileRef = doc(db, 'artifacts', appPathId, 'users', currentUser.uid, 'profile', 'user_data');
            
            unsubs = unsubs.filter(u => { 
                if (u.name === 'profile_listener') { u.fn(); return false; } 
                return true; 
            });

            return new Promise((resolve) => {
                const unsubFn = onSnapshot(profileRef, async (snapshot) => { 
                    if(snapshot.exists()) {
                        const data = snapshot.data();
                        
                        userData = {
                            likedGames: [], dislikedGames: [],
                            language: 'en', favoritedGames: [],
                            likedPosts: [], dislikedPosts: [],
                            following: [], followersCount: 0,
                            fontSize: 16, imgSize: 100,
                            theme: 'light', themePresets: {},
                            ...data
                        };
                        updateNavbarDisplay();
                        applyTheme(userData.theme || 'light');
                        applyFontSize(userData.fontSize || 16);
                        applyInterfaceScale(userData.imgSize || 100);
                        if((currentView === 'profile' || currentView === 'settings') && (!viewedProfileData || viewedProfileData.userId === currentUser.uid)) renderView(); 
                        resolve();
                    } else {
                        const defaultProfile = {
                            username: currentUser.email ? currentUser.email.split('@')[0] : "Player_" + Math.floor(Math.random()*10000),
                            bio: "Welcome to my Playerverse profile!",
                            pfp: "https://res.cloudinary.com/dtuccytyv/image/upload/v1779735218/User_starter_pfp_neoomb.png",
                            banner: "https://res.cloudinary.com/dtuccytyv/image/upload/v1779735215/User_starter_banner_kbzzzu.png",
                            userId: currentUser.uid,
                            likedGames: [], 
                            dislikedGames: [],
                            language: 'en',
                            favoritedGames: [],
                            likedPosts: [], 
                            dislikedPosts: [],
                            following: [],
                            followersCount: 0,
                            joinDate: Date.now()
                        };
                        await setDoc(profileRef, defaultProfile);
                        resolve();
                    }
                });
                unsubs.push({ name: 'profile_listener', fn: unsubFn });
            });
        }

        async function propagateProfileChanges(newUsername, newPfp) {
            const batch = writeBatch(db);
            const collectionsToUpdate = ['games', 'posts'];
            
            for (const colName of collectionsToUpdate) {
                const colRef = collection(db, 'artifacts', appPathId, 'public', 'data', colName);
                const q = query(colRef, where("authorId", "==", currentUser.uid));
                const snapshots = await getDocs(q);
                snapshots.forEach(document => {
                    batch.update(doc(db, 'artifacts', appPathId, 'public', 'data', colName, document.id), {
                        authorName: newUsername,
                        authorPfp: newPfp
                    });
                });
            }
            await batch.commit();
        }

        function setupDataListeners() {
            if (!currentUser) return;
            isLoadingContent = true;
            const collectionConfigs = [
                { key: 'games', path: 'games' }, 
                { key: 'posts', path: 'posts' }, 
                { key: 'franchises', path: 'franchises' },
                { key: 'music', path: 'music' }
            ];
            let loadedCollections = new Set();
            
            collectionConfigs.forEach(cfg => {
                const colRef = collection(db, 'artifacts', appPathId, 'public', 'data', cfg.path);
                const unsub = onSnapshot(
                    colRef,
                    (snapshot) => {
                        const data = snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}));
                        if(cfg.key === 'games') games = data;
                        else if(cfg.key === 'posts') posts = data;
                        else if(cfg.key === 'music') music = data;
                        else if(cfg.key === 'franchises') franchises = data;
                        
                        loadedCollections.add(cfg.key);
                        if(loadedCollections.size >= collectionConfigs.length) {
                            isLoadingContent = false;
                            renderView();
                        }
                        
                        const modalElement = document.querySelector('[data-modal-id]');
                        if (modalElement) {
                            const openId = modalElement.dataset.modalId;
                            const updated = data.find(x => x.id === openId);
                            if (updated) {
                                if (cfg.key === 'games') updateGameDetailsUI(updated);
                                else if (cfg.key === 'posts') updatePostDetailsUI(updated);
                            }
                        }

                        // Optimization: Prevent background Firestore updates from nuking the 
                        // active Modal or the real-time Nexus Chat UI.
                        const modalOpen = document.getElementById('modal-wrap')?.style.display !== 'none';
                        if (!modalOpen && currentView !== 'chat') renderView();
                    },
                    (error) => {
                        console.error('Error loading ' + cfg.key + ':', error);
                        loadedCollections.add(cfg.key);
                        if(loadedCollections.size >= collectionConfigs.length) {
                            isLoadingContent = false;
                            renderView();
                        }
                    }
                );
                unsubs.push({ name: cfg.key, fn: unsub });
            });

            const notifRef = collection(db, 'artifacts', appPathId, 'users', currentUser.uid, 'notifications');
            const unsubNotif = onSnapshot(
                notifRef,
                (snapshot) => {
                    notifications = snapshot.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b)=>(b.timestamp || 0) - (a.timestamp || 0));
                    const badge = document.getElementById('notif-badge');
                    if (badge) {
                        badge.classList.toggle('hidden', notifications.length === 0);
                        badge.innerText = notifications.length > 9 ? '9+' : notifications.length;
                    }
                    if (currentView === 'notifications') renderView();
                },
                (error) => {
                    console.error('Error loading notifications:', error);
                }
            );
            unsubs.push({ name: 'notifications', fn: unsubNotif });
        }

        function cleanupListeners() { 
            unsubs.forEach(u => u.fn()); 
            unsubs = [];

            gamesPagination.page = 0;

        function applyTheme(name) {
            const presets = userData?.themePresets || {};
            const styleEl = document.getElementById('custom-theme-styles');
            if (!styleEl) return;

            let colors = { bg: "#ffffff", text: "#0f172a", border: "#f1f5f9", accent: "#2563eb" };
            if (name === 'dark') colors = { bg: "#1e293b", text: "#f8fafc", border: "#334155", accent: "#60a5fa" };
            else if (name === 'midnight') colors = { bg: "#020617", text: "#94a3b8", border: "#1e293b", accent: "#3b82f6" };
            else if (name === 'neon') colors = { bg: "#0d001a", text: "#00ff00", border: "#ff00ff", accent: "#00ffff" };
            else if (presets[name]) colors = { ...presets[name], border: (presets[name].text + "22") };

            styleEl.innerHTML = `
                :root { 
                    --pv-bg: ${colors.bg}; 
                    --pv-text: ${colors.text}; 
                    --pv-border: ${colors.border}; 
                    --pv-accent: ${colors.accent}; 
                }
                
                /* Force backgrounds globally and kill gradients */
                :is(html, body, #app-container, #auth-container, #main-wrapper, #main-content, #main-content > div,
                aside, header, main, section, nav, .sidebar, .modal, .nexus-chat-shell, .play-nav,
                input, textarea, select, .search-input, .genre-pill:not(.active), .btn-outline,
                [class*="bg-"]):not(.game-card-image):not(.music-card-image):not(.series-icon):not(.profile-banner):not(.pfp-img):not(.lazy-image):not(.pfp-wrapper):not(.game-detail-cover):not(.btn-solid):not(.toast):not(.notif-badge):not(.pv-gradient-overlay):not([class*="bg-green-"]):not([class*="bg-red-"]),
                [class*="from-"]:not(.pv-gradient-overlay), [class*="to-"]:not(.pv-gradient-overlay), [class*="via-"]:not(.pv-gradient-overlay),
                .post-card, .game-card, .music-card, .post-textarea {
                    background-color: var(--pv-bg) !important;
                    background-image: none !important;
                    color: var(--pv-text) !important;
                    border-color: var(--pv-border) !important;
                    --tw-bg-opacity: 1 !important;
                    --tw-border-opacity: 1 !important;
                    --tw-gradient-from: transparent !important;
                    --tw-gradient-to: transparent !important;
                    --tw-gradient-stops: transparent !important;
                }

                /* Force text colors globally */
                :is(h1, h2, h3, h4, h5, h6, p, span, div, strong, label, input, textarea, select, i, [class*="text-"]):not(.text-white):not(.btn-solid *):not(.toast *):not(.notif-badge):not(.pv-accent-text):not([class*="text-green-"]):not([class*="text-red-"]) {
                    color: var(--pv-text) !important;
                }


                /* Ensure border colors are forced for color inputs and utility borders */
                [class*="border-"], .border, .border-2 {
                    border-color: var(--pv-border) !important;
                    --tw-border-opacity: 1 !important;
                }

                /* Color Input and specific element fixes */
                input[type="color"] {
                    border: 2px solid var(--pv-border) !important;
                    border-radius: 12px;
                    overflow: hidden;
                }

                /* Themed Shadows and Highlights */
                .shadow-sm, .shadow, .shadow-md, .shadow-lg, .shadow-xl, .shadow-2xl {
                    --tw-shadow-color: color-mix(in srgb, var(--pv-text), transparent 90%) !important;
                }
                
                .btn-solid:hover, .btn-outline:hover {
                    filter: brightness(1.1) !important;
                    transform: translateY(-2px) !important;
                    box-shadow: 0 10px 15px -3px color-mix(in srgb, var(--pv-accent), transparent 80%) !important;
                }
                .btn-solid, .btn-outline { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important; }

                /* Accent Colors */
                .text-blue-600, .text-blue-500, .text-indigo-600, .pv-accent-text { 
                    color: var(--pv-accent) !important; 
                }
                .btn-solid, .btn-solid *, .bg-blue-600, .bg-indigo-600, .notif-badge { 
                    background-color: var(--pv-accent) !important; 
                    background-image: none !important;
                    color: #ffffff !important; 
                }
                
                /* Active Sidebar State */
                .nav-item.active {
                    background-color: color-mix(in srgb, var(--pv-accent), transparent 85%) !important;
                    color: var(--pv-accent) !important;
                    border-left: 4px solid var(--pv-accent) !important;
                }
                .nav-item.active i { color: var(--pv-accent) !important; }

                /* Branding & PV Icon */
                .pv-logo {

        function refreshThemeTray() {
            const tray = document.getElementById('theme-tray');

            const currentTheme = userData.theme || 'light';
            const presets = userData.themePresets || {};
            
            const builtIn = [
                { id: 'light', name: 'Light', bg: "#ffffff", text: "#0f172a", accent: "#2563eb" },
                { id: 'dark', name: 'Dark', bg: "#1e293b", text: "#f8fafc", accent: "#60a5fa" },
                { id: 'midnight', name: 'Midnight', bg: "#020617", text: "#94a3b8", accent: "#3b82f6" },
                { id: 'neon', name: 'Neon', bg: "#0d001a", text: "#00ff00", accent: "#00ffff" }
            ];

            let html = builtIn.map(t => `
                <div onclick="handleThemeChangeRequest('${t.id}')" 
                    class="group relative flex flex-col items-center gap-2 p-3 rounded-2xl border-2 transition-all cursor-pointer ${currentTheme === t.id ? 'border-blue-600 bg-blue-50/50' : 'border-slate-100 hover:border-slate-200 bg-white'}">
                    <div class="w-full aspect-[4/3] rounded-lg overflow-hidden border border-slate-100 flex flex-col shadow-inner" style="background: ${t.bg}">

                             <div class="w-1/2 h-1 rounded-full" style="background: ${t.text}; opacity: 0.4"></div>
                        </div>
                        <div class="h-3 w-full flex items-center justify-end px-2" style="background: ${t.accent}">
                             <div class="w-2 h-2 rounded-full bg-white/40"></div>
                        </div>
                    </div>
                    <span class="text-[10px] font-black uppercase tracking-wider ${currentTheme === t.id ? 'text-blue-600' : 'text-slate-500'}">${t.name}</span>
                    ${currentTheme === t.id ? '<div class="absolute -top-1 -right-1 w-5 h-5 bg-blue-600 text-white rounded-full flex items-center justify-center shadow-lg ring-4 ring-white"><i data-lucide="check" class="w-3 h-3"></i></div>' : ''}
                </div>
            `).join('');
            
            Object.keys(presets).forEach(name => {
                const p = presets[name];
                html += `
                <div onclick="handleThemeChangeRequest('${name}')" 
                    class="group relative flex flex-col items-center gap-2 p-3 rounded-2xl border-2 transition-all cursor-pointer ${currentTheme === name ? 'border-blue-600 bg-blue-50/50' : 'border-slate-100 hover:border-slate-200 bg-white'}">
                    <div class="w-full aspect-[4/3] rounded-lg overflow-hidden border border-slate-100 flex flex-col shadow-inner" style="background: ${p.bg}">
                        <div class="flex-1 p-2">
                             <div class="w-3/4 h-1 rounded-full mb-1" style="background: ${p.text}; opacity: 0.8"></div>
                             <div class="w-1/2 h-1 rounded-full" style="background: ${p.text}; opacity: 0.4"></div>
                        </div>
                        <div class="h-3 w-full flex items-center justify-end px-2" style="background: ${p.accent}">
                             <div class="w-2 h-2 rounded-full bg-white/40"></div>
                        </div>
                    </div>
                    <span class="text-[10px] font-black uppercase tracking-wider ${currentTheme === name ? 'text-blue-600' : 'text-slate-500'}">${name}</span>
                    ${currentTheme === name ? '<div class="absolute -top-1 -right-1 w-5 h-5 bg-blue-600 text-white rounded-full flex items-center justify-center shadow-lg ring-4 ring-white"><i data-lucide="check" class="w-3 h-3"></i></div>' : ''}

                        <i data-lucide="trash-2" class="w-3 h-3"></i>

                try {
                    const userRef = doc(db, 'artifacts', appPathId, 'users', currentUser.uid, 'profile', 'user_data');
                    await updateDoc(userRef, { [`themePresets.${name}`]: deleteField() });

                        await updateDoc(userRef, { theme: 'light' }); // Revert to default if active theme is deleted

                userData.fontSize = size;

            const imgLabel = document.getElementById('img-val-label');

        function applyFontSize(size) { 
            document.documentElement.style.setProperty('--base-font-size', size + 'px');

        }

        function applyInterfaceScale(scale) {
            const wrapper = document.getElementById('app-container');

        window.handleMusicFileUpload = async (input) => {
            const file = input.files[0];
            if (!file) return;

            // Storage limits (Firestore/Nexus hard limit is ~1MB per document)
            const MAX_ENCODED_SIZE = 950000; // Leave room for title/metadata in the 1MB Doc
            const COMPRESSION_THRESHOLD = 680000; // Trigger compression earlier to avoid Base64 bloat
            
            // Try to extract cover metadata (works for .m4a, .mp3, etc)
            if (window.jsmediatags) {
                window.jsmediatags.read(file, {
                    onSuccess: (tag) => {
                        const picture = tag.tags.picture;
                        if (picture) {
                            const { data, format } = picture;
                            let base64String = "";
                            for (let i = 0; i < data.length; i++) {
                                base64String += String.fromCharCode(data[i]);
                            }
                            const coverUrl = `data:${format};base64,${window.btoa(base64String)}`;
                            
                            // Apply extracted cover to preview and state
                            tempMusicCover = coverUrl;
                            const preview = document.getElementById('modal-music-cover-preview');
                            const placeholder = document.getElementById('modal-music-cover-placeholder');
                            if (preview && placeholder) {
                                preview.src = coverUrl;
                                preview.classList.remove('hidden');
                                placeholder.classList.add('hidden');
                            }
                        }
                    },
                    onError: (error) => console.log('Metadata extraction skipped:', error.info)
                });
            }

            const label = document.getElementById('modal-music-file-label');
            const bar = document.getElementById('modal-music-post-bar');
            const progress = document.getElementById('modal-music-post-progress');
            const pctLabel = document.getElementById('modal-music-post-pct');
            const submitBtn = document.getElementById('music-submit-btn');
            
            try {
                if (progress) progress.classList.remove('hidden');
                if (submitBtn) {
                    submitBtn.disabled = true;
                    submitBtn.innerText = "Processing Audio...";
                }

                if (file.size > COMPRESSION_THRESHOLD) {
                    // Compress files above threshold to ensure final Base64 string is under 1MB
                    const result = await reencodeMedia(file, 'audio', 650000, (p) => {
                        if (bar) bar.style.width = p + '%';
                        if (pctLabel) pctLabel.innerText = Math.round(p) + '%';
                    });
                    tempMusicAsset = { url: result.dataUrl, name: file.name, type: result.mimeType };
                } else {
                    // Directly read files that are already within the safe size limit
                    const reader = new FileReader();
                    const dataUrl = await new Promise((resolve, reject) => {
                        reader.onload = e => {
                            if (bar) bar.style.width = '100%';
                            if (pctLabel) pctLabel.innerText = '100%';
                            resolve(e.target.result);
                        };
                        reader.onprogress = (e) => {
                            if (e.lengthComputable) {
                                const p = Math.round((e.loaded / e.total) * 100);
                                if (bar) bar.style.width = p + '%';
                                if (pctLabel) pctLabel.innerText = p + '%';
                            }
                        };
                        reader.onerror = reject;
                        reader.readAsDataURL(file);
                    });
                    tempMusicAsset = { url: dataUrl, name: file.name, type: file.type };
                }

                // Final validation to match Nexus Chat robustness
                if (tempMusicAsset && tempMusicAsset.url.length > MAX_ENCODED_SIZE) {
                    toast("Encoded track is too large for the 1MB limit. Try a shorter track.");
                    tempMusicAsset = null;
                    if (label) label.innerText = "Upload Audio (Max 1MB)";
                    if (progress) progress.classList.add('hidden');
                    if (pctLabel) pctLabel.innerText = '0%';
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.innerText = "Post Soundtrack";
                    }
                    return;
                }

                if (label) label.innerText = "✅ " + file.name;
                if (bar) bar.style.width = '100%';
                if (pctLabel) pctLabel.innerText = '100%';
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Post Soundtrack";
                }
            } catch (e) {
                toast("Audio processing failed.");
                if (progress) progress.classList.add('hidden');
                if (pctLabel) pctLabel.innerText = '0%';
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Post Soundtrack";
                }
            }
        };

            if (isFav) {
                userData.favoritedGames = (userData.favoritedGames || []).filter(id => id !== gameId);
            } else {
                userData.favoritedGames = [...(userData.favoritedGames || []), gameId];
            }
            
            // Trigger immediate background refresh (grid stars)
            renderView();
            
            // Update modal star if it's currently open
            ['modal-fav-star-label', 'modal-fav-star-btn'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.toggle('fill-current', !isFav);
            });

            const userRef = doc(db, 'artifacts', appPathId, 'users', currentUser.uid, 'profile', 'user_data');
            try {
                await updateDoc(userRef, { favoritedGames: isFav ? arrayRemove(gameId) : arrayUnion(gameId) });

                input.value = "";
                const item = (colName === 'games' ? games : posts).find(x => x.id === docId);
                if (item.authorId !== currentUser.uid) await createNotification(item.authorId, 'comment', `commented on your ${colName === 'games' ? 'game' : 'post'}.`, docId);

        window.toggleCommentLike = async (colName, docId, commentId) => {
            if(!currentUser) return;
            const item = (colName === 'games' ? games : posts).find(x => x.id === docId);
            if(!item || !item.comments) return;
            
            const newComments = item.comments.map(c => {
                if(c.id === commentId) {
                    const likes = c.likes || [];
                    const hasLiked = likes.includes(currentUser.uid);
                    return {
                        ...c,
                        likes: hasLiked ? likes.filter(id => id !== currentUser.uid) : [...likes, currentUser.uid]
                    };
                }
                return c;
            });

            try {
                await updateDoc(doc(db, 'artifacts', appPathId, 'public', 'data', colName, docId), {
                    comments: newComments
                });
            } catch(e) { toast("Action failed."); }
        };

            const displayComments = rootComments.slice(0, 5);
            return `

        window.toggleVote = async (colName, docId, direction) => {
            if(!currentUser) return;
            const docRef = doc(db, 'artifacts', appPathId, 'public', 'data', colName, docId);
            const userRef = doc(db, 'artifacts', appPathId, 'users', currentUser.uid, 'profile', 'user_data');
            const items = (colName === 'games' ? games : posts);
            const item = items.find(x => x.id === docId);
            
            const alreadyLiked = item.likes?.includes(currentUser.uid);
            const alreadyDisliked = item.dislikes?.includes(currentUser.uid);

            const userLikedField = colName === 'games' ? 'likedGames' : 'likedPosts';
            const userDislikedField = colName === 'games' ? 'dislikedGames' : 'dislikedPosts';

            try {
                // --- Optimistic UI Logic ---
                // Modify local item and user state before waiting for Firebase
                if (direction === 1) {
                    if (alreadyLiked) {
                        item.likes = item.likes.filter(id => id !== currentUser.uid);
                        userData[userLikedField] = userData[userLikedField].filter(id => id !== docId);
                    } else {
                        item.likes = [...(item.likes || []), currentUser.uid];
                        item.dislikes = (item.dislikes || []).filter(id => id !== currentUser.uid);
                        userData[userLikedField] = [...(userData[userLikedField] || []), docId];
                        userData[userDislikedField] = (userData[userDislikedField] || []).filter(id => id !== docId);
                    }
                } else {
                    if (alreadyDisliked) {
                        item.dislikes = item.dislikes.filter(id => id !== currentUser.uid);
                        userData[userDislikedField] = userData[userDislikedField].filter(id => id !== docId);
                    } else {
                        item.dislikes = [...(item.dislikes || []), currentUser.uid];
                        item.likes = (item.likes || []).filter(id => id !== currentUser.uid);
                        userData[userDislikedField] = [...(userData[userDislikedField] || []), docId];
                        userData[userLikedField] = (userData[userLikedField] || []).filter(id => id !== docId);
                    }
                }

                // Trigger UI updates immediately
                const modalElement = document.querySelector('[data-modal-id]');
                if (modalElement && modalElement.dataset.modalId === docId) {
                    if (colName === 'games') updateGameDetailsUI(item);
                    else updatePostDetailsUI(item);
                }
                // --- End Optimistic Logic ---


                if (direction === 1) { 
                    if (alreadyLiked) {
                        await updateDoc(docRef, { likes: arrayRemove(currentUser.uid) });
                        await updateDoc(userRef, { [userLikedField]: arrayRemove(docId) });
                    } else {
                        await updateDoc(docRef, { 
                            likes: arrayUnion(currentUser.uid), 
                            dislikes: arrayRemove(currentUser.uid) 
                        });
                        await updateDoc(userRef, { 
                            [userLikedField]: arrayUnion(docId),
                            [userDislikedField]: arrayRemove(docId)
                        });
                        if (item.authorId !== currentUser.uid) await createNotification(item.authorId, 'vote', `upvoted your ${colName === 'games' ? 'game' : 'post'}.`, docId);
                    }
                } else { 
                    if (alreadyDisliked) {
                        await updateDoc(docRef, { dislikes: arrayRemove(currentUser.uid) });
                        await updateDoc(userRef, { [userDislikedField]: arrayRemove(docId) });
                    } else {
                        await updateDoc(docRef, { 
                            dislikes: arrayUnion(currentUser.uid), 
                            likes: arrayRemove(currentUser.uid) 
                        });
                        await updateDoc(userRef, { 
                            [userDislikedField]: arrayUnion(docId),
                            [userLikedField]: arrayRemove(docId)
                        });
                    }
                }
            } catch(e) { toast("Vote failed."); }
        };

        function formatTime(ts) {
            if (!ts) return "Recently";
            const diff = Date.now() - (ts.toMillis?.() || ts);
            if (diff < 60000) return "Just now";
            if (diff < 3600000) return Math.floor(diff/60000) + "m ago";
            if (diff < 86400000) return Math.floor(diff/3600000) + "h ago";
            return new Date(ts.toMillis?.() || ts).toLocaleDateString();
        }

        // --- Nexus Upload & Audio Helpers ---
        function updateUploadProgress(percent, label = "Uploading...") {
            const container = document.getElementById('nexus-upload-progress');
            const bar = document.getElementById('nexus-upload-bar');
            const labelEl = document.getElementById('nexus-upload-label');
            const pctEl = document.getElementById('nexus-upload-pct');
            
            if (container && bar && labelEl && pctEl) {
                container.classList.remove('hidden');
                const p = Math.min(100, Math.max(0, Math.round(percent)));
                bar.style.width = p + '%';
                pctEl.innerText = p + '%';
                labelEl.innerText = label;
                
                if (p >= 100) {
                    setTimeout(() => { 
                        if(bar.style.width === '100%') container.classList.add('hidden'); 
                        bar.style.width = '0%'; 
                    }, 1500);
                }
            }
        }

        window.toggleAudioWidget = async (id) => {
            const media = document.getElementById(id + '-player');
            const btn = document.getElementById(id + '-btn');
            if (!media || !btn) return;
            
            const centerBtn = document.getElementById(id + '-center-btn');
            const isVideo = id.startsWith('video');
            const iconSize = isVideo ? 'w-4 h-4' : 'w-5 h-5';

            document.querySelectorAll('audio, video').forEach(el => {
                if (el.id !== id + '-player' && !el.paused) {
                    el.pause();
                    const otherId = el.id.replace('-player', '');
                    const otherBtn = document.getElementById(otherId + '-btn');
                    if (otherBtn) {
                        const oSize = otherId.startsWith('video') ? 'w-4 h-4' : 'w-5 h-5';
                        otherBtn.innerHTML = `<i data-lucide="play" class="${oSize}"></i>`;
                    }
                    const otherCenter = document.getElementById(otherId + '-center-btn');
                    if (otherCenter) otherCenter.classList.remove('hidden');
                }
            });

            if (media.paused) {
                try {
                    if (media.error) {
                        toast("Cannot play: This file is corrupted.");
                        return;
                    }
                    await media.play();
                    media.volume = globalVolume;
                    activeAudioId = id;
                    updateMiniPlayer(media, id);
                    if (btn) btn.innerHTML = `<i data-lucide="pause" class="${iconSize}"></i>`;
                    const gridIcon = document.getElementById('grid-icon-' + id.replace('audio-', ''));
                    if (gridIcon) gridIcon.innerHTML = `<i data-lucide="pause" class="w-10 h-10 fill-current ml-1.5"></i>`;
                    
                    if (centerBtn) centerBtn.classList.add('hidden');
                    lucide.createIcons();
                } catch (e) {
                    console.error("Playback failed:", e);
                }
            }
            else { 
                media.pause(); 
                updateMiniPlayer(media, id);
                if (btn) btn.innerHTML = `<i data-lucide="play" class="${iconSize}"></i>`;
                const gridIcon = document.getElementById('grid-icon-' + id.replace('audio-', ''));
                if (gridIcon) gridIcon.innerHTML = `<i data-lucide="play" class="w-10 h-10 fill-current ml-1.5"></i>`;
                
                if (centerBtn) centerBtn.classList.remove('hidden');
            }
            lucide.createIcons();
        };

        window.updateAudioProgress = (id) => {
            const audio = document.getElementById(id + '-player');
            const bar = document.getElementById(id + '-progress');
            const currEl = document.getElementById(id + '-current');
            if (!audio || !bar || !currEl || !audio.duration || !isFinite(audio.duration)) return;
            const p = (audio.currentTime / audio.duration) * 100;
            bar.style.width = p + '%';
            const m = Math.floor(audio.currentTime / 60);
            const s = Math.floor(audio.currentTime % 60);
            currEl.innerText = `${m}:${s.toString().padStart(2, '0')}`;
            
            if (activeAudioId === id) {
                updateMiniPlayer(audio, id);
            }
        };

        window.resetAudioWidget = (id) => {
            const btn = document.getElementById(id + '-btn');
            if (btn) {
                btn.innerHTML = `<i data-lucide="play" class="${id.startsWith('video') ? 'w-4 h-4' : 'w-5 h-5'}"></i>`;
                lucide.createIcons();
            }
            const bar = document.getElementById(id + '-progress');
            if (bar) bar.style.width = '0%';
            if (activeAudioId === id) {
                closeMiniPlayer();
                activeAudioId = null;
            }
            const centerBtn = document.getElementById(id + '-center-btn');
            if (centerBtn) centerBtn.classList.remove('hidden');

        window.updateMiniPlayer = (audio, id) => {
            const mini = document.getElementById('mini-player');
            if (!mini) return;
            
            const title = audio.dataset.title;
            const author = audio.dataset.author;
            const cover = audio.dataset.cover;
            
            document.getElementById('mini-track-title').innerText = title;
            document.getElementById('mini-track-author').innerText = author;
            
            const duration = audio.duration || 0;
            const currentTime = audio.currentTime || 0;
            const p = (currentTime / (duration || 1)) * 100;
            document.getElementById('mini-progress-bar').style.width = p + '%';
            document.getElementById('mini-player-img').src = cover || 'https://res.cloudinary.com/dtuccytyv/image/upload/v1779735212/Icon_h9o8u7.png';
            
            const format = (s) => Math.floor(s/60) + ":" + Math.floor(s%60).toString().padStart(2,'0');
            document.getElementById('mini-time-display').innerText = `${format(currentTime)} / ${isFinite(duration) ? format(duration) : '0:00'}`;
            
            const playBtn = document.getElementById('mini-play-btn');
            playBtn.innerHTML = audio.paused ? '<i data-lucide="play" class="w-5 h-5 fill-current"></i>' : '<i data-lucide="pause" class="w-5 h-5 fill-current"></i>';
            
            mini.classList.remove('translate-y-32', 'opacity-0');
            mini.classList.add('translate-y-0', 'opacity-100');
            lucide.createIcons();
        };

        window.toggleMiniPlayer = () => {
            if (!activeAudioId) return;
            window.toggleAudioWidget(activeAudioId);
        };

        window.seekMiniPlayer = (e) => {
            if (!activeAudioId) return;
            const audio = document.getElementById(activeAudioId + '-player');
            if (!audio || !audio.duration) return;
            const rect = e.currentTarget.getBoundingClientRect();
            audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
        };

        window.setAudioVolume = (val) => {
            globalVolume = val;
            if (activeAudioId) {
                const audio = document.getElementById(activeAudioId + '-player');
                if (audio) audio.volume = val;
            }
            const icon = document.getElementById('mini-vol-icon');
            if (icon) icon.dataset.lucide = val == 0 ? 'volume-x' : (val < 0.5 ? 'volume-1' : 'volume-2');

        };

        window.closeMiniPlayer = () => {

            const missing = uids.filter(id => id && !playerverseUserCache[id]);
            if (missing.length === 0) return;
            
            const fetchPromises = missing.map(async (uid) => {
                try {
                    const snap = await getDoc(doc(db, 'artifacts', appPathId, 'users', uid, 'profile', 'user_data'));
                    if (snap.exists()) playerverseUserCache[uid] = snap.data();
                    else playerverseUserCache[uid] = { username: "Guest", pfp: "" };
                } catch (e) { playerverseUserCache[uid] = { username: "Unknown", pfp: "" }; }
            });
            await Promise.all(fetchPromises);
        }

            document.getElementById('pv-confirm-btn').onclick = () => { closeModal(); cb(); };

            const t = document.createElement('div');

            t.className = `toast active ${bgClass}`;

        window.deleteGame = async (id) => {

        function lazyLoadImages() {
            const images = document.querySelectorAll('.lazy-image');
            if (!images.length) return;
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const el = entry.target;
                        const src = el.dataset.src;
                        if (src) {
                            el.style.backgroundImage = `url(${src})`;
                            el.classList.remove('animate-pulse');
                            observer.unobserve(el);
                        }
                    }
                });
            }, { rootMargin: '50px' });
            images.forEach(img => observer.observe(img));
        }

        // ========== NEXUS MESSAGING INTEGRATION ==========

        // Initialize Nexus for authenticated user
        function setupNexusForUser() {
            if (!window.realtimeDb || !currentUser) return;
            
            // We no longer store full profiles in RTDB. Only status (online/offline) for real-time presence.
            const nexusUserRef = window.realtimeDb.ref(`users/${currentUser.uid}`);
            nexusUserRef.update({
                uid: currentUser.uid,
                status: 'online'
            }).catch(err => console.error('Nexus user sync error:', err));

            // Set status to offline on disconnect
            window.realtimeDb.ref('.info/connected').on('value', (snap) => {
                if (snap.val() === true) {
                    nexusUserRef.onDisconnect().update({ status: 'offline' });
                    nexusUserRef.update({ status: 'online' });
                }
            });

            loadNexusRooms();
        }

        // Load and render channels list
        function loadNexusRoomsList() {
            const container = document.getElementById('nexus-channels-list');
            if (!container) return;

            container.innerHTML = '';
            
            // Add global channel
            const globalBtn = document.createElement('button');
            globalBtn.className = 'w-full text-left px-4 py-2 rounded-lg hover:bg-slate-50 transition-colors font-semibold text-slate-700';
            globalBtn.onclick = () => enterNexusRoom('global', 'global');
            globalBtn.innerHTML = `<i data-lucide="hash" class="w-4 h-4 inline mr-2"></i> global`;
            container.appendChild(globalBtn);

            // Add other rooms
            Object.entries(allRooms).forEach(([roomId, room]) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left px-4 py-2 rounded-lg hover:bg-slate-50 transition-colors font-semibold text-slate-700';

        // Compress and upload image file
        window.handleNexusFileUpload = async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const maxSizeMB = 1;
            const maxSizeBytes = maxSizeMB * 1024 * 1024;
            const roomId = currentRoomId || (currentDmPartnerId ? [currentUser.uid, currentDmPartnerId].sort().join('_dm_') : 'global');

            const isImage = file.type.startsWith('image/');
            const isVideo = file.type.startsWith('video/');
            const isAudio = file.type.startsWith('audio/');

            if (isImage) {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    updateUploadProgress(30, "Compressing Image...");
                    const compressed = await compressImage(e.target.result, 1200, 1000, 0.8);
                    
                    if (compressed.length > 1000000) {
                         updateUploadProgress(0, "Error");
                         return toast("Image too complex to fit in a 1MB message.");
                    }

                    updateUploadProgress(80, "Finalizing...");
                    realtimeDb.ref(`messages/${roomId}`).push({
                        text: '', imageUrl: compressed, senderId: currentUser.uid,
                        timestamp: firebase.database.ServerValue.TIMESTAMP
                    }).then(() => {
                        updateUploadProgress(100, "Sent!");
                    });
                };
                reader.readAsDataURL(file);
            } else if (file.size > maxSizeBytes && (isVideo || isAudio)) {
                try {
                    const type = isVideo ? 'video' : 'audio';
                    updateUploadProgress(0, `Analyzing ${type}...`);
                    const result = await reencodeMedia(file, type, maxSizeBytes, (p) => {
                        updateUploadProgress(Math.floor(p * 0.9), `Compressing ${type}...`);
                    });
                    
                    if (result.dataUrl.length > 1000000) {
                        updateUploadProgress(0, "Error");
                        return toast("Compression failed: File still exceeds 1MB limit.");
                    }

                    updateUploadProgress(95, "Sending...");
                    realtimeDb.ref(`messages/${roomId}`).push({
                        text: '', fileUrl: result.dataUrl, fileName: `compressed_${file.name}`,
                        fileType: result.mimeType, senderId: currentUser.uid,
                        timestamp: firebase.database.ServerValue.TIMESTAMP
                    }).then(() => {
                        updateUploadProgress(100, "Sent!");
                    });
                } catch (err) {
                    updateUploadProgress(0, "Error");
                    toast(`Compression failed: ${err.message || err}`);
                }
            } else {
                if (file.size > maxSizeBytes) {
                    return toast(`File too large (${(file.size / 1024 / 1024).toFixed(2)}MB). Auto-compression available for images, video, and audio.`);
                }
                updateUploadProgress(20, "Reading file...");
                const reader = new FileReader();
                reader.onload = (e) => {
                    if (e.target.result.length > 1000000) {
                        return toast("This specific file type expands too much for Nexus (1MB limit).");
                    }
                    updateUploadProgress(80, "Sending...");
                    realtimeDb.ref(`messages/${roomId}`).push({
                        text: '', fileUrl: e.target.result, fileName: file.name, fileType: file.type,
                        senderId: currentUser.uid, timestamp: firebase.database.ServerValue.TIMESTAMP
                    }).then(() => {
                        updateUploadProgress(100, "Sent!");
                        toast(`✅ File sent: ${file.name}`);
                    });
                };
                reader.readAsDataURL(file);
            }
            event.target.value = '';
        };

        async function reencodeMedia(file, type, targetSizeBytes, onProgress) {
            return new Promise((resolve, reject) => {
                const media = document.createElement(type);
                media.src = URL.createObjectURL(file);
                media.muted = true;
                media.volume = 0;
                media.crossOrigin = "anonymous";
                media.setAttribute('playsinline', '');
                media.style.position = 'fixed'; media.style.top = '-9999px'; document.body.appendChild(media);
                let timeout = setTimeout(() => { 
                    if (media.parentElement) { reject("Media load timeout"); URL.revokeObjectURL(media.src); media.remove(); }
                }, 15000);
                
                media.onloadedmetadata = () => {
                    clearTimeout(timeout);
                    const isVideo = type === 'video';
                    
                    // Hard limit for binary size to ensure Base64 result stays under 950,000 chars.
                    // ~680KB binary ≈ 930KB Base64.
                    const safeBinaryLimit = Math.min(680000, targetSizeBytes);
                    
                    const duration = (isFinite(media.duration) && media.duration > 0) ? media.duration : 5;
                    const targetBits = safeBinaryLimit * 7; // Slightly lower multiplier to account for container overhead
                    let bps = Math.floor(targetBits / duration);
                    
                    let stream, canvas, ctx, raf, videoCallbackId;

                    // Dynamic resolution based on available bitrate
                    let targetRes = 360;
                    if (isVideo) {
                        if (bps < 500000) targetRes = 240;
                        if (bps < 250000) targetRes = 144;
                        // Prevent literal corruption from ultra-low bitrates
                        if (bps < 100000) { media.remove(); return reject("Video is too long to compress under 1MB with playable quality."); }
                    }

                    const mimes = isVideo ? 
                        ['video/webm;codecs=vp8', 'video/webm', 'video/mp4'] :
                        ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'];
                    const supportedType = mimes.find(m => MediaRecorder.isTypeSupported(m));
                    
                    if (!supportedType) { media.remove(); return reject("Recording not supported."); }

                    if (isVideo) {
                        canvas = document.createElement('canvas');
                        ctx = canvas.getContext('2d');
                        const scale = Math.min(1, targetRes / Math.max(media.videoWidth, media.videoHeight));
                        canvas.width = media.videoWidth * scale;
                        canvas.height = media.videoHeight * scale;
                        stream = canvas.captureStream(24);
                        
                        const cap = (media.captureStream || media.mozCaptureStream);
                        if (cap) {
                            const audioStream = cap.call(media);
                            audioStream.getAudioTracks().forEach(t => stream.addTrack(t));
                        }
                    } else if (media.captureStream || media.mozCaptureStream) {
                        stream = (media.captureStream || media.mozCaptureStream).call(media);
                    }

                    if (!stream) { 
                        URL.revokeObjectURL(media.src);
                        media.remove(); 
                        return reject("Your browser doesn't support stream capture."); 
                    }

                    // Removed the 150k floor to allow actual compression for long tracks
                    const recorder = new MediaRecorder(stream, { mimeType: supportedType, bitsPerSecond: bps });
                    const chunks = [];
                    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
                    recorder.onstop = () => {
                        if (videoCallbackId && media.cancelVideoFrameCallback) media.cancelVideoFrameCallback(videoCallbackId);
                        else if (raf) cancelAnimationFrame(raf);

                        const finalMime = (chunks.length > 0 && chunks[0].type) ? chunks[0].type : (recorder.mimeType || supportedType);
                        const blob = new Blob(chunks, { type: finalMime });
                        const reader = new FileReader();
                        reader.onload = e => {
                            const dataUrl = e.target.result;
                            URL.revokeObjectURL(media.src);
                            media.remove();
                            if (!dataUrl || dataUrl.length < 2000) {
                                reject("Encoding failed: File too small/empty.");
                            } else {
                                resolve({ dataUrl, mimeType: finalMime });
                            }
                        };
                        reader.readAsDataURL(blob);
                    };

                    const drawFrame = () => {
                        if (media.paused || media.ended) return;
                        ctx.drawImage(media, 0, 0, canvas.width, canvas.height);
                        if (media.requestVideoFrameCallback) {
                            videoCallbackId = media.requestVideoFrameCallback(drawFrame);
                        } else {
                            raf = requestAnimationFrame(drawFrame);
                        }
                    };

                    media.ontimeupdate = () => {
                        if (onProgress) onProgress((media.currentTime / media.duration) * 100);
                    };

                    media.currentTime = 0;
                    media.play().then(() => {
                        if (isVideo) {
                            drawFrame();
                            // Wait a tiny moment for the first frame to hit the buffer before starting
                            setTimeout(() => { if(recorder.state === 'inactive') recorder.start(); }, 100);
                        } else {
                            recorder.start();
                        }

                        const checkEnd = setInterval(() => {
                            if (media.ended || media.currentTime >= duration || !media.parentElement) {
                                clearInterval(checkEnd);
                                if (recorder.state === 'recording') recorder.stop();
                            }
                        }, 500);
                    }).catch(e => { 
                        URL.revokeObjectURL(media.src);
                        media.remove(); 
                        reject("Playback blocked. Try again or check your browser settings."); 
                    });

                    media.onerror = () => reject("Playback failed");
                };
                media.onerror = () => reject("Load failed");
            });
        }

        window.submitCreateChannel = () => {
            if (!realtimeDb) return toast('Database error');

            const userRoomsCount = Object.values(allRooms || {}).filter(r => r.createdBy === currentUser.uid).length;
            if (userRoomsCount >= 15) {
                return toast("Channel limit reached (15). Please delete an existing channel first.");
            }

            const name = document.getElementById('channel-name-input').value.trim();
            const isPrivate = document.getElementById('channel-private-toggle').checked;
            const code = isPrivate ? (document.getElementById('channel-code-input').value.trim() || Math.random().toString(36).substring(7)) : '';

            if (!name) return toast('Channel name is required');

            realtimeDb.ref('rooms').push({
                name: name,
                description: '',
                isPrivate: isPrivate,
                code: code,
                createdBy: currentUser.uid,
                createdAt: firebase.database.ServerValue.TIMESTAMP
            }).then(() => {
                closeModal();
                toast('🎉 Channel created!');
            }).catch(err => {
                toast('Failed to create channel: ' + err.message);
            });
        };

        window.handleDeleteNexusRoom = (roomId) => {
            if (roomId === 'global') return;
            pvConfirm(`Are you sure you want to delete the channel "${allRooms[roomId]?.name}"? This will delete all messages permanently.`, async () => {
                try {
                    await realtimeDb.ref(`rooms/${roomId}`).remove();
                    await realtimeDb.ref(`messages/${roomId}`).remove();
                    enterNexusRoom('global', 'global');
                    toast("Channel deleted.");
                } catch (e) { toast("Failed to delete channel."); }
            });
        };

        // Private room access modal
        window.showPrivateRoomModal = (roomId, roomName, correctCode) => {
            showModal(`
                <h2 class="text-2xl font-black mb-1 text-slate-900 tracking-tight flex items-center gap-3">
                    <i data-lucide="lock" class="w-7 h-7 text-amber-600"></i>
                    Protected Channel
                </h2>
                <p class="text-slate-400 font-medium mb-6">This channel requires an access code.</p>

                <div class="space-y-4">
                    <div class="p-4 bg-amber-50 border border-amber-200 rounded-xl">
                        <p class="text-sm font-bold text-amber-900 flex items-center gap-2"><i data-lucide="lock" class="w-5 h-5"></i> ${sanitizeHtml(roomName)}</p>
                    </div>

                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Enter Access Code</label>
                        <input id="private-room-code-input" type="password" placeholder="Enter code..." class="h-12 w-full px-4 border-2 border-slate-100 rounded-xl font-bold focus:border-blue-500 outline-none transition-colors" onkeydown="if(event.key==='Enter') verifyRoomAccess('${roomId}', '${roomName}', '${correctCode}')">
                    </div>

                    <div class="flex gap-3">
                        <button onclick="closeModal()" class="btn-outline !h-12 flex-1">Cancel</button>
                        <button onclick="verifyRoomAccess('${roomId}', '${roomName}', '${correctCode}')" class="btn-solid !h-12 flex-1 flex items-center justify-center gap-2">
                            <i data-lucide="unlock" class="w-4 h-4"></i> Verify
                        </button>
                    </div>
                </div>
            `);
            setTimeout(() => {
                const input = document.getElementById('private-room-code-input');
                if (input) input.focus();
            }, 100);
        };

        window.verifyRoomAccess = (roomId, roomName, correctCode) => {
            const userCode = document.getElementById('private-room-code-input').value.trim();
            if (userCode !== correctCode) {
                document.getElementById('private-room-code-input').classList.add('border-red-500', 'focus:border-red-500');
                toast('❌ Incorrect access code');
                return;
            }
            
            // Remember this room for future sessions
            accessedPrivateRooms.add(roomId);
            
            closeModal();
            currentRoomId = roomId;
            currentDmPartnerId = null;

            const roomNameEl = document.getElementById('nexus-room-name');
            const roomDescEl = document.getElementById('nexus-room-desc');
            const codeBtn = document.getElementById('show-room-code-btn');
            const isCreator = allRooms[roomId]?.createdBy === currentUser.uid;
            
            if (roomNameEl) roomNameEl.innerHTML = `<i data-lucide="lock" class="w-5 h-5 inline-block mr-2"></i> ${sanitizeHtml(roomName)} ${isCreator ? '<span class="text-xs ml-2 px-2 py-1 bg-blue-100 text-blue-600 rounded-full font-bold">Creator</span>' : ''}`;
            lucide.createIcons();
            const hasAccess = accessedPrivateRooms.has(roomId) || isCreator;
            const iconName = allRooms[roomId]?.isPrivate ? (hasAccess ? 'lock-open' : 'lock') : 'hash';
            if (roomNameEl) roomNameEl.innerHTML = `<i data-lucide="${iconName}" class="w-5 h-5 inline-block mr-2"></i> ${sanitizeHtml(roomName)} ${isCreator ? '<span class="text-xs ml-2 px-2 py-1 bg-blue-100 text-blue-600 rounded-full font-bold">Creator</span>' : ''}`;
            lucide.createIcons();
            if (roomDescEl) roomDescEl.innerText = allRooms[roomId]?.description || ''; // No change here

            // Show code button for creators
            if (codeBtn) {
                if (isCreator) {
                    codeBtn.classList.remove('hidden');
                } else {
                    codeBtn.classList.add('hidden');
                }
            }

            listenForNexusMessages(roomId);
            toast('✅ Access granted!');
        };

        // Show room access code modal for creators
        window.showRoomCodeModal = () => {
            const roomData = allRooms[currentRoomId];
            if (!roomData || !roomData.code) {
                toast('❌ Could not load room code');
                return;
            }

            showModal(`
                <h2 class="text-2xl font-black mb-1 text-slate-900 tracking-tight flex items-center gap-3">
                    <i data-lucide="key" class="w-7 h-7 text-blue-600"></i>
                    Room Access Code
                </h2>
                <p class="text-slate-400 font-medium mb-6">Share this code with people you want to invite:</p>

                <div class="space-y-4">
                    <div class="p-4 bg-blue-50 border-2 border-blue-500 rounded-xl text-center">
                        <p class="text-xs font-bold text-slate-500 mb-2">CHANNEL CODE</p>
                        <p class="text-3xl font-black text-blue-700 font-mono tracking-widest">${sanitizeHtml(roomData.code)}</p>
                    </div>

                    <button onclick="copyToClipboard('${sanitizeHtml(roomData.code)}'); toast('✅ Code copied!'); closeModal();" class="btn-solid !h-12 w-full flex items-center justify-center gap-2">
                        <i data-lucide="copy" class="w-4 h-4"></i> Copy Code
                    </button>
                    
                    <button onclick="closeModal()" class="btn-outline !h-12 w-full">Close</button>
                </div>
            `);
            setTimeout(() => lucide.createIcons(), 100);
        };

        // Helper to copy to clipboard
        window.copyToClipboard = (text) => {
            navigator.clipboard.writeText(text).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
            });
        };

        // Add contact
        window.addNexusContact = async () => {
            pvPrompt('Enter User UID:', '', (uid) => {
                if (!uid || !realtimeDb || !currentUser) return;
                if (uid === currentUser.uid) return toast("You can't add yourself!");
                const contactRef = realtimeDb.ref(`users/${currentUser.uid}/contacts/${uid}`);
                contactRef.once('value').then((snap) => {
                    if (snap.exists()) {
                        toast('User is already in your contacts');
                    } else {
                        contactRef.set(true).then(() => toast('Contact added!')).catch(err => toast('Failed to add contact: ' + err.message));
                    }
                });
            });
        };

        window.setNexusReply = (id, name, text) => {
            activeReply = { id, name, text: text.length > 60 ? text.substring(0, 60) + '...' : text };
            const bar = document.getElementById('nexus-reply-bar');
            const target = document.getElementById('nexus-reply-target-name');
            if (bar && target) {
                target.innerText = name;
                bar.classList.remove('hidden');
            }
            const input = document.getElementById('nexus-message-input');
            if (input) input.focus();
            lucide.createIcons();
        };

        window.cancelNexusReply = () => {
            activeReply = null;
            const bar = document.getElementById('nexus-reply-bar');
            if (bar) bar.classList.add('hidden');
        };

        // Load initial rooms when chat view opens
        window.reloadNexusUI = () => {
            if (currentView === 'chat') {
                loadNexusRoomsList();
            }
        };
    </script>

            <main id="main-content" class="no-scrollbar"></main>
        </div>

        <!-- Now Playing Mini Player -->
        <div id="mini-player" class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[calc(100%-32px)] max-w-2xl bg-white/90 backdrop-blur-2xl border border-slate-200 rounded-[32px] p-3 shadow-[0_20px_50px_-12px_rgba(0,0,0,0.3)] z-[100] transition-all duration-500 transform translate-y-32 opacity-0">
            <div class="flex items-center gap-3 md:gap-5">
                <img id="mini-player-img" src="" class="w-12 h-12 md:w-14 md:h-14 rounded-2xl object-cover shadow-md border border-slate-100 shrink-0">
                <div class="flex-1 min-w-0">
                    <div class="flex items-center justify-between mb-1">
                        <div class="overflow-hidden">
                            <p id="mini-track-title" class="font-black text-slate-900 truncate text-sm md:text-base leading-tight">No Track Playing</p>
                            <p id="mini-track-author" class="text-[10px] font-black text-blue-500 uppercase tracking-widest truncate">...</p>
                        </div>
                        <span id="mini-time-display" class="hidden md:block text-[10px] font-black text-slate-400 whitespace-nowrap ml-4">0:00 / 0:00</span>
                    </div>
                    <div class="h-1.5 w-full bg-slate-100 rounded-full overflow-hidden cursor-pointer relative group/progress" onclick="seekMiniPlayer(event)">
                        <div id="mini-progress-bar" class="h-full bg-blue-600 transition-all duration-100 relative shadow-[0_0_8px_rgba(37,99,235,0.4)]" style="width: 0%"></div>
                    </div>
                </div>
                <div class="flex items-center gap-2 pr-1">
                    <div class="hidden sm:flex items-center gap-2 mr-2 group/vol">
                        <i id="mini-vol-icon" data-lucide="volume-2" class="w-4 h-4 text-slate-400"></i>
                        <input type="range" min="0" max="1" step="0.01" value="1" oninput="setAudioVolume(this.value)" class="w-16 md:w-24 h-1 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
                    </div>
                    <button id="mini-play-btn" onclick="toggleMiniPlayer()" class="w-10 h-10 md:w-12 md:h-12 bg-slate-900 text-white rounded-full flex items-center justify-center hover:scale-105 active:scale-95 transition-all shadow-lg">
                        <i data-lucide="play" class="w-5 h-5 fill-current"></i>
                    </button>
                    <button onclick="closeMiniPlayer()" class="w-8 h-8 text-slate-400 hover:text-red-500 transition-colors">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });
    </script>
</body>
</html>
